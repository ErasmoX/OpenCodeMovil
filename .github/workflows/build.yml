name: Compilar APK OpenCodeMovil

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Wrapper si no existe
        run: |
          if [ ! -f "gradlew" ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK en modo Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeMovil-v1.0-APK
          path: app/build/outputs/apk/debug/*.apk
