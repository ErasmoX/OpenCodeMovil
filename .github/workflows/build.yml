name: Compilar y Publicar APK OpenCodeMovil

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle Oficial
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Generar Wrapper si falta
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Crear debug.keystore temporal
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK en modo Debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renombrar archivo APK para release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/OpenCodeMovil.apk

      - name: Subir como Artifact temporal
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeMovil-v1.0-APK
          path: release-apk/OpenCodeMovil.apk

      - name: Publicar Release oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "OpenCodeMovil v1.0.0"
          body: |
            ### 📱 Instalador directo de OpenCodeMovil
            - Compilación automática generada con éxito.
            - Descarga el archivo `OpenCodeMovil.apk` directamente en tu teléfono Android para instalarlo.
          files: release-apk/OpenCodeMovil.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
